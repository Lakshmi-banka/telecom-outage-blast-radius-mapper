
name: Telecom Outage Mapper - CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "578541425970"
  ECR_REGISTRY: 578541425970.dkr.ecr.ap-south-1.amazonaws.com
  S3_LOG_BUCKET: telecom-outage-logs-578541425970-ap-south-1

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        run: |
          docker build \
            -t $ECR_REGISTRY/telecom-frontend:latest \
            ./telecom-outage-frontend
          docker push $ECR_REGISTRY/telecom-frontend:latest

      - name: Build and push backend
        run: |
          docker build \
            -t $ECR_REGISTRY/telecom-backend:latest \
            ./telecom-outage-backend
          docker push $ECR_REGISTRY/telecom-backend:latest

      - name: Build and push Python engine
        run: |
          docker build \
            -t $ECR_REGISTRY/telecom-python-engine:latest \
            ./python-engine
          docker push $ECR_REGISTRY/telecom-python-engine:latest

      - name: Deploy application through SSM
        id: deploy
        run: |
          COMMAND="cd /home/ubuntu/telecom-outage-mapper && aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 578541425970.dkr.ecr.ap-south-1.amazonaws.com && docker compose pull && docker compose up -d && docker compose ps && docker compose logs --no-color --tail=200 > /tmp/telecom-deployment.log && aws s3 cp /tmp/telecom-deployment.log s3://$S3_LOG_BUCKET/deployment-logs/deployment-\$(date -u +%Y%m%dT%H%M%SZ).log"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -n --arg cmd "$COMMAND" '{commands: [$cmd]}')" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text

              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1

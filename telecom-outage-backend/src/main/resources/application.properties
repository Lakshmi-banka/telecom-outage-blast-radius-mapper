
spring.application.name=telecom-outage-backend
server.port=${SERVER_PORT:8080}

# PostgreSQL database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telecom}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Actuator
management.endpoints.web.exposure.include=health,info

# Python processing engine
python.engine.base-url=${PYTHON_ENGINE_BASE_URL:http://127.0.0.1:8001}
python.engine.api-key=${PYTHON_ENGINE_API_KEY}

# Automatic failure-event mapping
app.failure-mapping.interval-ms=15000
app.failure-mapping.system-user-email=admin1@telecom.com
